<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vitrine 2025 - Checkout</title>

  <!-- Favicon -->
  <link rel="icon" href="favicon.ico" type="image/x-icon">

  <link rel="stylesheet" href="checkout.css">
</head>
<body>
  <!-- Header -->
  <header>
    <div class="logo">Vitrine 2025</div>
  </header>

  <!-- Conteúdo -->
  <main class="checkout-container">
    <section class="checkout-section">
      <h1>Resumo do Pedido</h1>
      <ul id="checkout-list"></ul>

      <div class="summary">
        <p id="checkout-items">Itens: 0</p>
        <p id="checkout-subtotal">Subtotal: R$0,00</p>
        <p id="checkout-total">Total: R$0,00</p>
      </div>

      <div class="payment-methods">
        <h2>Formas de Pagamento</h2>
        <label><input type="radio" name="payment" value="cartao" checked> 💳 Cartão de Crédito</label><br>
        <label><input type="radio" name="payment" value="pix"> ⚡ PIX</label>
      </div>

      <button id="confirm-btn" class="checkout-btn">Confirmar Compra</button>
    </section>
  </main>

  <footer>
    <p>© 2025 Vitrine 2025. Todos os direitos reservados.</p>
  </footer>

  <script>
    // Recupera itens do localStorage
    const checkoutList = document.getElementById('checkout-list');
    const checkoutItems = document.getElementById('checkout-items');
    const checkoutSubtotal = document.getElementById('checkout-subtotal');
    const checkoutTotal = document.getElementById('checkout-total');
    const confirmBtn = document.getElementById('confirm-btn');

    let cartItems = JSON.parse(localStorage.getItem('cartItems')) || [];
    let total = 0;

    function renderCheckout() {
      checkoutList.innerHTML = '';
      total = 0;

      cartItems.forEach((item, index) => {
        const li = document.createElement('li');
        li.classList.add('checkout-item');

        li.innerHTML = `
          <span>${item.name} - R$${item.price.toFixed(2).replace('.', ',')}</span>
          <button class="remove-btn" data-index="${index}">❌</button>
        `;

        checkoutList.appendChild(li);
        total += item.price;
      });

      checkoutItems.textContent = `Itens: ${cartItems.length}`;
      checkoutSubtotal.textContent = `Subtotal: R$${total.toFixed(2).replace('.', ',')}`;
      checkoutTotal.textContent = `Total: R$${total.toFixed(2).replace('.', ',')}`;

      // Botões de remover
      document.querySelectorAll('.remove-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const index = parseInt(btn.getAttribute('data-index'));
          cartItems.splice(index, 1);
          localStorage.setItem('cartItems', JSON.stringify(cartItems));
          renderCheckout();
        });
      });
    }

    renderCheckout();

    confirmBtn.addEventListener('click', () => {
      if (cartItems.length === 0) {
        alert('Seu carrinho está vazio!');
        return;
      }
      const payment = document.querySelector('input[name="payment"]:checked').value;
      alert(`Compra confirmada com pagamento via ${payment.toUpperCase()}! Obrigado por comprar na Vitrine 2025.`);
      localStorage.removeItem('cartItems');
      window.location.href = 'LojaDeProdutos.html';
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Áudio e Vídeo</title>
</head>
<body>
    <h1>Áudio</h1>
    <audio preload="metadata" controls autoplay loop>
        <source src="audio.mp3" type="audio/mpeg">
        <source src="audio.ogg" type="audio/ogg">
        <source src="audio.wav" type="audio/wav">
        <p>Seu navegador não suporta o elemento de áudio. <a href="Stranger_Things.mp3" download="Abertura_Stranger_Things.mp3" type="audio/mpeg">Baixe o arquivo de áudio</a></p>
    </audio>

    <h1>Vídeo</h1>
    <video width="500" controls autoplay>
        <source src="video.mp4" type="video/mp4">
        <source src="video.webm" type="video/webm">
        <source src="video.ogg" type="video/ogg">
        <p>Seu navegador não suporta o elemento de vídeo. <a href="Stranger_Things.mp4" download="Abertura_Stranger_Things.mp4" type="video/mp4">Baixe o arquivo de vídeo</a></p>
    </video>

    <h1>Incorporar Vídeos</h1>
    <iframe width="560" height="315" src="https://www.youtube.com/embed/XqZsoesa55w" 
        title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; 
        encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>
</body>
</html>
